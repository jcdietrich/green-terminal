globals:
  - id: msg_queue
    type: 'std::vector<std::string>'
    restore_value: no
    # Persisted via gt::save_state / gt::load_state in includes/queue_storage.h
    # — stored as JSON in NVS under "term/state_json".
  - id: chunk_group         # parallel to msg_queue; 0 = standalone, >0 = group id shared by chunks of one split message
    type: 'std::vector<int>'
    restore_value: no
  - id: chunk_alert         # parallel to msg_queue; 0 = normal, 1 = alert (rendered in alert colour)
    type: 'std::vector<int>'
    restore_value: no
  - id: chunk_sticky        # parallel to msg_queue; 1 = pin PAUSE_AFTER until cleared
    type: 'std::vector<int>'
    restore_value: no
  - id: next_group_id
    type: int
    initial_value: '1'
  - id: visible_lines
    type: 'std::vector<std::string>'
    restore_value: no
  - id: ghost_lines         # CRT-phosphor afterimage of recently-removed/cleared lines
    type: 'std::vector<std::string>'
    restore_value: no
  - id: ghost_is_alert      # whether the ghost text was an alert (renders in alert colour)
    type: bool
    initial_value: 'false'
  - id: ghost_started_ms
    type: uint32_t
    initial_value: '0'
  - id: cur_idx
    type: int
    initial_value: '0'
  - id: char_idx
    type: int
    initial_value: '0'
  - id: state                # 0=IDLE 1=TYPING 2=PAUSE_AFTER 3=CLEAR_PAUSE
    type: int
    initial_value: '0'
  - id: state_started_ms
    type: uint32_t
    initial_value: '0'
  - id: last_char_ms
    type: uint32_t
    initial_value: '0'
  - id: cursor_on
    type: bool
    initial_value: 'true'
  # Snapshot of the HA-set status-LED state taken when an alert begins.
  # Restored when the alert ends so the manual setting "survives" alerts.
  # `reset_leds` and `clear_queue` wipe this back to off.
  - id: led_saved_on
    type: bool
    initial_value: 'false'
  - id: led_saved_r
    type: float
    initial_value: '0.0f'
  - id: led_saved_g
    type: float
    initial_value: '0.0f'
  - id: led_saved_b
    type: float
    initial_value: '0.0f'
  - id: led_saved_brightness
    type: float
    initial_value: '1.0f'
  - id: led_saved_effect
    type: std::string
    initial_value: '"None"'

  # Tap-discriminator state: bumped on every touch (screen or IMU
  # impulse), resolved by the `handle_tap` script after a 350 ms window
  # of inactivity.
  - id: pending_tap_count
    type: int
    initial_value: '0'

  # Timestamp of the last accepted IMU tap, for the refractory window
  # that prevents one physical tap from registering as multiple events.
  - id: last_tap_ms
    type: uint32_t
    initial_value: '0'

script:
  - id: enqueue_message
    mode: single
    parameters:
      msg: string
      is_alert: bool
      is_sticky: bool
    then:
      - lambda: |-
          if (msg.empty()) return;
          const int input_cap = (int)id(input_cap_cfg).state;
          const int char_cap = (int)id(char_cap_cfg).state;
          const int split_thr = (int)id(split_threshold_cfg).state;
          const int queue_cap = (int)id(queue_cap_cfg).state;

          // Expand `:name:` shortcuts (e.g. :heart: → ♥, :warning: → ) before
          // any size enforcement or splitting.
          std::string expanded = gt::apply_emoji_shortcuts(msg);
          std::string m = expanded.substr(0, input_cap);
          while (!m.empty() &&
                 (m.back() == ' ' || m.back() == '\n' || m.back() == '\r')) {
            m.pop_back();
          }
          if (m.empty()) return;

          std::vector<std::string> chunks;
          auto add_chunk = [&](std::string s) {
            size_t a = 0;
            while (a < s.size() &&
                   (s[a] == ' ' || s[a] == '\n' || s[a] == '\r')) a++;
            size_t b = s.size();
            while (b > a &&
                   (s[b-1] == ' ' || s[b-1] == '\n' || s[b-1] == '\r')) b--;
            if (b <= a) return;
            s = s.substr(a, b - a);
            if ((int)s.size() > char_cap) s.resize(char_cap);
            chunks.push_back(s);
          };

          if ((int)m.size() <= split_thr) {
            add_chunk(m);
          } else {
            size_t start = 0;
            while (start < m.size()) {
              size_t end = std::min(start + (size_t)split_thr, m.size());
              if (end < m.size()) {
                size_t nl = m.rfind('\n', end);
                if (nl != std::string::npos && nl > start) {
                  end = nl;
                } else {
                  size_t spc = m.rfind(' ', end);
                  if (spc != std::string::npos && spc > start) end = spc;
                }
              }
              add_chunk(m.substr(start, end - start));
              start = end;
              while (start < m.size() &&
                     (m[start] == ' ' || m[start] == '\n' || m[start] == '\r')) {
                start++;
              }
            }
          }
          if (chunks.empty()) return;

          int gid = (chunks.size() == 1) ? 0 : id(next_group_id);
          if (chunks.size() > 1) id(next_group_id) = id(next_group_id) + 1;
          int alert_flag = is_alert ? 1 : 0;
          int sticky_flag = is_sticky ? 1 : 0;

          for (auto &c : chunks) {
            id(msg_queue).push_back(c);
            id(chunk_group).push_back(gid);
            id(chunk_alert).push_back(alert_flag);
            id(chunk_sticky).push_back(sticky_flag);
          }

          while ((int)id(msg_queue).size() > queue_cap) {
            int head_g = id(chunk_group).front();
            if (head_g == gid && gid != 0) break;
            int n = gt::evict_oldest_group(id(msg_queue), id(chunk_group),
                                           id(chunk_alert), id(chunk_sticky));
            if (n == 0) break;
            id(cur_idx) = std::max(0, id(cur_idx) - n);
            if (id(cur_idx) >= (int)id(msg_queue).size()) {
              id(cur_idx) = 0;
              id(char_idx) = 0;
              id(visible_lines).clear();
              id(state) = 0;
            }
          }

          ESP_LOGI("term", "enqueued %d chunk(s) gid=%d alert=%d sticky=%d queue=%d",
                   (int)chunks.size(), gid, alert_flag, sticky_flag,
                   (int)id(msg_queue).size());
      - script.execute: save_queue

  - id: force_advance
    mode: single
    then:
      - lambda: |-
          id(ghost_lines) = id(visible_lines);
          id(ghost_is_alert) =
            (id(cur_idx) < (int)id(chunk_alert).size())
            && id(chunk_alert)[id(cur_idx)] != 0;
          id(ghost_started_ms) = millis();
          id(state) = 3;
          id(state_started_ms) = millis() - (uint32_t)id(clear_pause_ms_cfg).state;
          id(visible_lines).clear();

  # Remove just the currently-displayed message group from the queue.
  # Touchscreen double-tap calls this; HA/CLI callers use `clear_indices`
  # with the explicit group number instead.
  - id: clear_current_group
    mode: single
    then:
      - lambda: |-
          if (id(msg_queue).empty()) return;
          int cur_g = gt::group_position(id(chunk_group), id(cur_idx));
          if (cur_g <= 0) return;
          int chunk_idx = gt::find_group_start(id(chunk_group), cur_g);
          if (chunk_idx < 0) return;
          bool was_alert = (id(cur_idx) < (int)id(chunk_alert).size())
                           && id(chunk_alert)[id(cur_idx)] != 0;
          int removed = gt::remove_group_at(id(msg_queue),
                                            id(chunk_group),
                                            id(chunk_alert),
                                            id(chunk_sticky),
                                            cur_g);
          if (removed <= 0) return;
          id(ghost_lines) = id(visible_lines);
          id(ghost_is_alert) = was_alert;
          id(ghost_started_ms) = millis();
          id(visible_lines).clear();
          id(char_idx) = 0;
          if (chunk_idx <= id(cur_idx)) {
            id(cur_idx) = std::max(0, id(cur_idx) - removed);
          }
          if (id(msg_queue).empty()
              || (size_t)id(cur_idx) >= id(msg_queue).size()) {
            id(cur_idx) = 0;
            id(state) = 0;
          }
          id(state_started_ms) = millis();
          ESP_LOGI("term", "cleared current group %d (chunks=%d), queue=%d",
                   cur_g, removed, (int)id(msg_queue).size());
      - script.execute: save_queue

  # Tap-vs-double-tap discriminator. Each touch bumps `pending_tap_count`
  # and (re)starts this script; after 350 ms of touch inactivity the
  # script fires the resolved gesture and resets the counter. `mode:
  # restart` lets every fresh tap cancel the in-flight delay so the
  # window is anchored to the LAST touch in a burst, not the first.
  - id: handle_tap
    mode: restart
    then:
      - delay: 350ms
      - if:
          condition:
            lambda: 'return id(pending_tap_count) >= 2;'
          then:
            - script.execute: clear_current_group
          else:
            - script.execute: force_advance
      - lambda: 'id(pending_tap_count) = 0;'

  - id: save_queue
    mode: single
    then:
      - lambda: |-
          gt::save_state(id(msg_queue), id(chunk_group), id(chunk_alert),
                         id(chunk_sticky), id(next_group_id));

  - id: load_queue
    mode: single
    then:
      - lambda: |-
          gt::load_state(id(msg_queue), id(chunk_group), id(chunk_alert),
                         id(chunk_sticky), id(next_group_id));

interval:
  - interval: 5ms
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(msg_queue).empty()) {
            id(state) = 0;
            return;
          }
          const int max_cols = (int)id(max_cols_cfg).state;
          const int max_rows = (int)id(max_rows_cfg).state;
          float _cps = (float)id(typewriter_cps_cfg).state;
          if (_cps < 1.0f) _cps = 1.0f;
          const uint32_t char_period_ms = (uint32_t)(1000.0f / _cps);
          const uint32_t pause_after_ms = (uint32_t)id(pause_after_ms_cfg).state;
          const uint32_t clear_pause_ms = (uint32_t)id(clear_pause_ms_cfg).state;

          switch (id(state)) {
            case 0: {  // IDLE -> start typing first message
              id(cur_idx) = 0;
              id(char_idx) = 0;
              id(visible_lines).clear();
              id(state) = 1;
              id(state_started_ms) = now;
              id(last_char_ms) = 0;
              break;
            }
            case 1: {  // TYPING — at most one char per tick, no catch-up.
              if (id(cur_idx) >= (int)id(msg_queue).size()) {
                id(cur_idx) = 0;
              }
              const std::string& m = id(msg_queue)[id(cur_idx)];

              if (id(char_idx) >= (int)m.size()) {
                int cur_g = (id(cur_idx) < (int)id(chunk_group).size())
                              ? id(chunk_group)[id(cur_idx)] : 0;
                int next_idx = id(cur_idx) + 1;
                bool same_group = (cur_g != 0)
                                  && (next_idx < (int)id(msg_queue).size())
                                  && (next_idx < (int)id(chunk_group).size())
                                  && (id(chunk_group)[next_idx] == cur_g);
                if (same_group) {
                  if (!id(visible_lines).empty()) {
                    std::string& last = id(visible_lines).back();
                    if (!last.empty() && last.back() != ' '
                        && (int)last.size() < max_cols) {
                      last.push_back(' ');
                    }
                  }
                  id(cur_idx) = next_idx;
                  id(char_idx) = 0;
                  id(last_char_ms) = now;
                } else {
                  id(state) = 2;
                  id(state_started_ms) = now;
                }
                break;
              }

              if (now - id(last_char_ms) < char_period_ms) break;

              char c = m[id(char_idx)];
              if (id(visible_lines).empty()) {
                id(visible_lines).push_back("");
              }
              std::string& last = id(visible_lines).back();

              bool starts_word = (c != ' ' && c != '\n')
                                 && (last.empty() || last.back() == ' ');
              bool cur_alert =
                (id(cur_idx) < (int)id(chunk_alert).size())
                && id(chunk_alert)[id(cur_idx)] != 0;
              if (starts_word) {
                int wend = id(char_idx);
                while (wend < (int)m.size()
                       && m[wend] != ' ' && m[wend] != '\n') {
                  wend++;
                }
                int word_len = wend - id(char_idx);
                if (word_len <= max_cols
                    && (int)last.size() + word_len > max_cols) {
                  if ((int)id(visible_lines).size() >= max_rows) {
                    id(ghost_lines) = id(visible_lines);
                    id(ghost_is_alert) = cur_alert;
                    id(ghost_started_ms) = now;
                  }
                  id(visible_lines).push_back("");
                  if ((int)id(visible_lines).size() > max_rows) {
                    id(visible_lines).erase(id(visible_lines).begin());
                  }
                }
              }

              std::string& cur = id(visible_lines).back();
              if (c == '\n' || (int)cur.size() >= max_cols) {
                if ((int)id(visible_lines).size() >= max_rows) {
                  id(ghost_lines) = id(visible_lines);
                  id(ghost_is_alert) = cur_alert;
                  id(ghost_started_ms) = now;
                }
                id(visible_lines).push_back("");
                if ((int)id(visible_lines).size() > max_rows) {
                  id(visible_lines).erase(id(visible_lines).begin());
                }
                if (c != '\n' && c != ' ') {
                  id(visible_lines).back().push_back(c);
                }
              } else if (cur.empty() && c == ' ') {
                // Suppress leading spaces on a freshly-wrapped line.
              } else {
                cur.push_back(c);
              }
              id(char_idx)++;
              id(last_char_ms) = now;
              break;
            }
            case 2: {  // PAUSE_AFTER
              if (now - id(state_started_ms) >= pause_after_ms) {
                id(ghost_lines) = id(visible_lines);
                id(ghost_is_alert) =
                  (id(cur_idx) < (int)id(chunk_alert).size())
                  && id(chunk_alert)[id(cur_idx)] != 0;
                id(ghost_started_ms) = now;
                id(visible_lines).clear();
                id(state) = 3;
                id(state_started_ms) = now;
              }
              break;
            }
            case 3: {  // CLEAR_PAUSE
              if (now - id(state_started_ms) >= clear_pause_ms) {
                if (!id(msg_queue).empty()) {
                  // Sticky messages loop back to the start of their own group
                  // instead of advancing to the next group.
                  bool cur_sticky =
                    (id(cur_idx) < (int)id(chunk_sticky).size())
                    && id(chunk_sticky)[id(cur_idx)] != 0;
                  if (cur_sticky) {
                    int idx = id(cur_idx);
                    while (idx > 0
                           && !gt::is_group_start(id(chunk_group), idx)) {
                      idx--;
                    }
                    id(cur_idx) = idx;
                  } else {
                    id(cur_idx) = (id(cur_idx) + 1) % id(msg_queue).size();
                  }
                }
                id(char_idx) = 0;
                id(state) = 1;
                id(state_started_ms) = now;
                id(last_char_ms) = 0;
              }
              break;
            }
          }

  - interval: 500ms
    then:
      - lambda: id(cursor_on) = !id(cursor_on);

  # Status-LED ↔ alert sync. Picks colour + effect based on the FIRST of
  # `:nf-heart:` / `:bolt:` / `:check:` glyphs found in the current chunk;
  # default alert (no marker) is amber scan. Edge-triggered on (alert_kind)
  # so we only touch the LightCall when the state actually changes.
  # Also handles backlight on/off for the Sleep-when-idle feature.
  - interval: 200ms
    then:
      - lambda: |-
          // Backlight + display-refresh management for Sleep-when-idle.
          // On sleep entry we drop the display update_interval to 60 s
          // (essentially "never") so the SPI flush stops eating ~10 mA.
          // On wake we restore it to 16 ms before the backlight fades in,
          // so the first frame of new content is ready when the user can
          // see the panel.
          static bool last_sleep = false;
          bool sleep_now = id(sleep_when_idle_cfg).state
                           && id(msg_queue).empty();
          if (sleep_now != last_sleep) {
            last_sleep = sleep_now;
            if (sleep_now) {
              id(term_display).set_update_interval(60000);
              auto call = id(backlight).turn_off();
              call.set_transition_length(300);
              call.perform();
              gt::set_cpu_freq(80);   // drop CPU last — SPI flushed at 240
            } else {
              gt::set_cpu_freq(240);  // ramp CPU first — display + LEDs need it
              id(term_display).set_update_interval(16);
              auto call = id(backlight).turn_on();
              call.set_transition_length(300);
              call.perform();
            }
          }

          // 0 = off, 1 = default amber, 2 = heart-red, 3 = bolt-blue, 4 = check-green
          static int last_kind = 0;

          int kind = 0;  // off if no alert showing
          bool is_alert =
            (id(state) != 0)
            && (id(cur_idx) < (int)id(chunk_alert).size())
            && (id(chunk_alert)[id(cur_idx)] != 0);
          if (is_alert) {
            const std::string &msg = id(msg_queue)[id(cur_idx)];
            // UTF-8 byte sequences for the trigger glyphs.
            static const char HEART[]   = "\xEF\x80\x84";   // U+F004 :nf-heart:
            static const char HEART2[]  = "\xE2\x99\xA5";   // U+2665 :heart: ♥
            static const char BOLT[]    = "\xE2\x9A\xA1";   // U+26A1 :bolt:
            static const char CHECK[]   = "\xEF\x80\x8C";   // U+F00C :check:
            static const char XMARK[]   = "\xEF\x80\x8D";   // U+F00D :x:
            static const char WARNING[] = "\xEF\x81\xB1";   // U+F071 :warning:
            // Either heart glyph triggers — take the earliest occurrence.
            size_t h  = std::min(msg.find(HEART), msg.find(HEART2));
            size_t b  = msg.find(BOLT);
            size_t c  = msg.find(CHECK);
            size_t x  = msg.find(XMARK);
            size_t w  = msg.find(WARNING);
            size_t first = std::string::npos;
            kind = 1;  // default amber pulse unless a marker overrides
            if (h != std::string::npos && (first == std::string::npos || h < first)) {
              first = h; kind = 2;
            }
            if (b != std::string::npos && (first == std::string::npos || b < first)) {
              first = b; kind = 3;
            }
            if (c != std::string::npos && (first == std::string::npos || c < first)) {
              first = c; kind = 4;
            }
            if (x != std::string::npos && (first == std::string::npos || x < first)) {
              first = x; kind = 5;
            }
            if (w != std::string::npos && (first == std::string::npos || w < first)) {
              first = w; kind = 6;
            }
          }

          if (kind == last_kind) return;

          // Entering alert from no-alert: snapshot whatever HA had the strip
          // set to, so we can put it back when the alert clears.
          if (last_kind == 0 && kind != 0) {
            auto ld = id(status_leds);
            id(led_saved_on)         = ld->remote_values.is_on();
            id(led_saved_r)          = ld->remote_values.get_red();
            id(led_saved_g)          = ld->remote_values.get_green();
            id(led_saved_b)          = ld->remote_values.get_blue();
            id(led_saved_brightness) = ld->remote_values.get_brightness();
            id(led_saved_effect)     = ld->get_effect_name();
          }
          last_kind = kind;

          // Exiting alert: restore the saved HA state (default = off).
          if (kind == 0) {
            if (id(led_saved_on)) {
              auto call = id(status_leds).turn_on();
              call.set_transition_length(0);
              call.set_color_mode(esphome::light::ColorMode::RGB);
              call.set_red(id(led_saved_r));
              call.set_green(id(led_saved_g));
              call.set_blue(id(led_saved_b));
              call.set_brightness(id(led_saved_brightness));
              const std::string &eff = id(led_saved_effect);
              call.set_effect(eff.empty() ? "None" : eff);
              call.perform();
            } else {
              auto call = id(status_leds).turn_off();
              call.set_transition_length(0);
              call.perform();
            }
            return;
          }
          // Force the previous effect off first so the next effect samples
          // the fresh colour we set, not the colour interpolated mid-fade.
          {
            auto reset = id(status_leds).turn_on();
            reset.set_effect("None");
            reset.set_transition_length(0);
            reset.perform();
          }
          auto call = id(status_leds).turn_on();
          call.set_transition_length(0);
          call.set_color_mode(esphome::light::ColorMode::RGB);
          call.set_brightness(1.0f);
          switch (kind) {
            case 2:  // :nf-heart: / :heart: → pulse red
              call.set_red(1.0f); call.set_green(0.0f); call.set_blue(0.0f);
              call.set_effect("pulse");
              break;
            case 3:  // :bolt: → flicker very-white-blue at 25% baseline
              call.set_red(0.75f); call.set_green(0.85f); call.set_blue(1.0f);
              call.set_brightness(0.25f);
              call.set_effect("flicker");
              break;
            case 4:  // :check: → scan green
              call.set_red(0.0f); call.set_green(1.0f); call.set_blue(0.0f);
              call.set_effect("scan");
              break;
            case 5:  // :x: → scan red
              call.set_red(1.0f); call.set_green(0.0f); call.set_blue(0.0f);
              call.set_effect("scan");
              break;
            case 6:  // :warning: → scan amber
              call.set_red(1.0f); call.set_green(0.69f); call.set_blue(0.0f);
              call.set_effect("scan");
              break;
            default:  // alert with no marker → pulse amber
              call.set_red(1.0f); call.set_green(0.69f); call.set_blue(0.0f);
              call.set_effect("pulse");
          }
          call.perform();
